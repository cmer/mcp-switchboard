services:
  switchboard:
    build: .
    container_name: mcp-switchboard
    restart: unless-stopped
    ports:
      - "8787:8787"
      # Uncomment together with MCP_PORT below to expose the agent endpoint on its own port.
      # Bind it to a specific host interface to control who can reach it, e.g. "0.0.0.0:8788:8788"
      # for the agent endpoint while the UI above stays on "127.0.0.1:8787:8787".
      # - "8788:8788"
    environment:
      # The URL you open the UI at in your browser (upstream OAuth redirects come back here)
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:8787}
      # The origin agents reach /mcp/<agent-slug> at, if it differs or sits behind a proxy/tunnel —
      # required for Claude Desktop / claude.ai when the proxy forwards plain HTTP (see README)
      # - MCP_PUBLIC_URL=${MCP_PUBLIC_URL}
      # Serve /mcp/<agent-slug> on a separate port from the UI/API (optional)
      # - MCP_PORT=8788
    volumes:
      # SQLite db + encryption key — back this up
      - ./data:/app/data
    # Local (stdio) servers run in a bubblewrap sandbox inside the container, which needs a user
    # namespace that Docker's defaults refuse. The seccomp profile is Docker's default plus only
    # the syscalls bubblewrap uses; systempaths lets it mount a fresh /proc for each server; and
    # AppArmor's default profile blocks the mounts. Remove all three only if you turn the sandbox
    # off in Settings. See docs/sandbox.md.
    security_opt:
      - seccomp=./docker/seccomp.json
      - systempaths=unconfined
      - apparmor=unconfined
